name: Build

on:
  workflow_run:
    workflows: [Checking]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

env:
  CI: 'false'
  CADENZA_BUILD_PROFILE: production

jobs:
  artifacts:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/checking.yml'
    strategy:
      fail-fast: false
      matrix:
        platform: [remote, host]
        include:
          - platform: remote
            runner: ubuntu-latest
          - platform: host
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify exact checked revision
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Resolve CI release identity
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: node tools/release-identity.mjs --sha "$CHECKED_SHA" --build "$BUILD_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.platform == 'remote'
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: matrix.platform == 'remote'
        with:
          path: .cache/gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/remote/gradle/wrapper/gradle-wrapper.properties', 'apps/remote/gradle.properties', 'apps/remote/settings.gradle.kts', 'apps/remote/build.gradle.kts', 'apps/remote/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Restore Android release keystore
        if: matrix.platform == 'remote'
        env:
          KEYSTORE_BASE64: ${{ secrets.CADENZA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cadenza-release.jks"
          chmod 600 "$RUNNER_TEMP/cadenza-release.jks"
      - if: matrix.platform == 'remote'
        run: bash tools/ci/android-sdk.sh
      - name: Build Production APK
        if: matrix.platform == 'remote'
        working-directory: apps/remote
        env:
          CADENZA_KEYSTORE_PATH: ${{ runner.temp }}/cadenza-release.jks
          CADENZA_KEYSTORE_PASSWORD: ${{ secrets.CADENZA_ANDROID_KEYSTORE_PASSWORD }}
          CADENZA_KEY_ALIAS: ${{ secrets.CADENZA_ANDROID_KEY_ALIAS }}
          CADENZA_KEY_PASSWORD: ${{ secrets.CADENZA_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$CADENZA_KEYSTORE_PASSWORD"
          test -n "$CADENZA_KEY_ALIAS"
          test -n "$CADENZA_KEY_PASSWORD"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          bash ./gradlew :app:assembleRelease -Pcadenza.profile=production --no-daemon
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk "../../dist/Cadenza-Remote-$CADENZA_RELEASE_VERSION.apk"
      - name: Restore macOS signing identity
        if: matrix.platform == 'host'
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CADENZA_MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CADENZA_MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.CADENZA_MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MACOS_SIGNING_CERTIFICATE_BASE64"
          test -n "$MACOS_SIGNING_CERTIFICATE_PASSWORD"
          test -n "$MACOS_SIGNING_IDENTITY"
          keychain="$RUNNER_TEMP/cadenza-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -base64 32)"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          signing_archive="$RUNNER_TEMP/cadenza-signing.p12"
          signing_certificate="$RUNNER_TEMP/cadenza-signing.cer"
          printf '%s' "$MACOS_SIGNING_CERTIFICATE_BASE64" | /usr/bin/base64 --decode > "$signing_archive"
          /usr/bin/security import "$signing_archive" -k "$keychain" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          /usr/bin/openssl pkcs12 -in "$signing_archive" -nokeys -passin env:MACOS_SIGNING_CERTIFICATE_PASSWORD |
            /usr/bin/sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > "$signing_certificate"
          test -s "$signing_certificate"
          /usr/bin/security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$signing_certificate"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          /usr/bin/security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          /usr/bin/security default-keychain -s "$keychain"
          identities="$(/usr/bin/security find-identity -v -p codesigning "$keychain")"
          printf '%s\n' "$identities"
          printf '%s\n' "$identities" | /usr/bin/grep -F "$MACOS_SIGNING_IDENTITY"
          echo "CADENZA_MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Build Production Host archive
        if: matrix.platform == 'host'
        env:
          CADENZA_BUILD_PROFILE: production
        run: bash apps/host/Scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'remote'
        with:
          name: Cadenza-remote-production-${{ github.event.workflow_run.head_sha }}
          path: dist/Cadenza-Remote-*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'host'
        with:
          name: Cadenza-host-production-${{ github.event.workflow_run.head_sha }}
          path: dist/Cadenza-Host-*-arm64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: artifacts
    runs-on: macos-26
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Resolve CI release identity
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: node tools/release-identity.mjs --sha "$CHECKED_SHA" --build "$BUILD_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Prepare Android manifest analyzer
        run: bash tools/ci/android-sdk.sh
      - name: Verify release configuration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('shared/release-config.json', 'utf8'));
          if (config.repository !== process.env.GITHUB_REPOSITORY ||
              typeof config.public_key_spki_base64 !== 'string' ||
              config.public_key_spki_base64.length < 40) {
            throw new Error('shared/release-config.json must contain this repository and the generated public update key.');
          }
          NODE
      - name: Download built Production artifacts
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/cadenza-artifacts/remote" "$RUNNER_TEMP/cadenza-artifacts/host" dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "Cadenza-remote-production-$CHECKED_SHA" --dir "$RUNNER_TEMP/cadenza-artifacts/remote"
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "Cadenza-host-production-$CHECKED_SHA" --dir "$RUNNER_TEMP/cadenza-artifacts/host"
          cp "$RUNNER_TEMP"/cadenza-artifacts/remote/Cadenza-Remote-*.apk dist/
          cp "$RUNNER_TEMP"/cadenza-artifacts/host/Cadenza-Host-*-arm64.zip dist/
      - name: Restore update signing key
        env:
          UPDATE_PRIVATE_PEM: ${{ secrets.CADENZA_UPDATE_PRIVATE_PEM }}
        run: |
          test -n "$UPDATE_PRIVATE_PEM"
          printf '%s' "$UPDATE_PRIVATE_PEM" > "$RUNNER_TEMP/cadenza-update-private.pem"
          chmod 600 "$RUNNER_TEMP/cadenza-update-private.pem"
      - name: Sign release metadata
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          bash tools/sign-release.sh "$GITHUB_REPOSITORY" "$RUNNER_TEMP/cadenza-update-private.pem"
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view "$CADENZA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$CADENZA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$CADENZA_RELEASE_TITLE" --notes "Automated Production build $CADENZA_BUILD_NUMBER from $CHECKED_SHA." --draft=false --prerelease=false
          else
            gh release create "$CADENZA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$CHECKED_SHA" \
              --title "$CADENZA_RELEASE_TITLE" --notes "Automated Production build $CADENZA_BUILD_NUMBER from $CHECKED_SHA."
          fi
          gh release upload "$CADENZA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/Cadenza-Host-$CADENZA_RELEASE_VERSION-arm64.zip" \
            "dist/Cadenza-Remote-$CADENZA_RELEASE_VERSION.apk" \
            dist/cadenza-release.json dist/cadenza-release.sig
