name: Build

on:
  workflow_run:
    workflows: [Checking]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  CI: 'true'
  CADENZA_BUILD_PROFILE: ci

jobs:
  artifacts:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/checking.yml'
    strategy:
      fail-fast: false
      matrix:
        platform: [remote, host]
        include:
          - platform: remote
            runner: ubuntu-latest
          - platform: host
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify exact checked revision
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.platform == 'remote'
        with:
          distribution: temurin
          java-version: '17.0.20+1'
      - if: matrix.platform == 'remote'
        run: bash tools/ci/android-sdk.sh
      - name: Build CI APK
        if: matrix.platform == 'remote'
        working-directory: apps/remote
        env:
          CADENZA_ANDROID_KEYSTORE_BASE64: ${{ secrets.CADENZA_ANDROID_KEYSTORE_BASE64 }}
          CADENZA_KEYSTORE_PASSWORD: ${{ secrets.CADENZA_ANDROID_KEYSTORE_PASSWORD }}
          CADENZA_KEY_ALIAS: ${{ secrets.CADENZA_ANDROID_KEY_ALIAS }}
          CADENZA_KEY_PASSWORD: ${{ secrets.CADENZA_ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/cadenza-ci.keystore"
          printf '%s' "$CADENZA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          CADENZA_KEYSTORE_PATH="$keystore" bash ./gradlew :app:assembleRelease -Pcadenza.profile=ci --no-daemon
      - name: Build CI app bundle and ZIP
        if: matrix.platform == 'host'
        run: bash apps/host/Scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cadenza-${{ matrix.platform }}-ci-${{ github.event.workflow_run.head_sha }}
          path: |
            apps/remote/app/build/outputs/apk/release/*.apk
            dist/Cadenza-Host-*-ci-arm64.zip
          if-no-files-found: error
          retention-days: 14
