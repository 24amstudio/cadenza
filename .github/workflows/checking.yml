name: Checking

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - run: bash tools/ci/dependencies.sh
      - run: node tools/check.mjs --portable

  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/remote/gradle/wrapper/gradle-wrapper.properties', 'apps/remote/gradle.properties', 'apps/remote/settings.gradle.kts', 'apps/remote/build.gradle.kts', 'apps/remote/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/robolectric-m2
          key: robolectric-${{ runner.os }}-${{ hashFiles('apps/remote/app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-
      - run: bash tools/ci/android-sdk.sh
      - name: Run Remote checks
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          bash apps/remote/check.sh

  host:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/host/.build/module-cache
          key: host-modules-${{ runner.os }}-${{ hashFiles('apps/host/Package.swift', 'apps/host/Sources/**/*.swift', 'apps/host/Tests/**/*.swift') }}
          restore-keys: |
            host-modules-${{ runner.os }}-
      - run: bash apps/host/Scripts/check.sh
