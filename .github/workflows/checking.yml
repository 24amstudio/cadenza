name: Checking

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      host: ${{ steps.paths.outputs.host }}
      remote: ${{ steps.paths.outputs.remote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Determine affected applications
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == pull_request ]]; then
            changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_paths="$(git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            changed_paths="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          fi

          host=false
          remote=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              apps/host/*) host=true ;;
              apps/remote/*) remote=true ;;
              .github/*|shared/*|tools/*|AGENTS.md|SPEC.md|package.json|package-lock.json|bun.lock|bun.lockb)
                host=true
                remote=true
                ;;
            esac
          done <<< "$changed_paths"

          printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
          printf 'remote=%s\n' "$remote" >> "$GITHUB_OUTPUT"

  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - run: bash tools/ci/dependencies.sh
      - run: node tools/check.mjs --portable --static

  remote:
    needs: scope
    if: needs.scope.outputs.remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/remote/gradle/wrapper/gradle-wrapper.properties', 'apps/remote/gradle.properties', 'apps/remote/settings.gradle.kts', 'apps/remote/build.gradle.kts', 'apps/remote/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/robolectric-m2
          key: robolectric-${{ runner.os }}-${{ hashFiles('apps/remote/app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-
      - run: bash tools/ci/android-sdk.sh
      - name: Run Remote static checks
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle
          ANDROID_USER_HOME: ${{ github.workspace }}/.cache/android-user
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          cd apps/remote
          bash ./gradlew :app:ktlintCheck :app:lintDebug :app:lintRelease :app:compileDebugKotlin :app:compileReleaseKotlin --no-daemon

  host:
    needs: scope
    if: needs.scope.outputs.host == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/host/.build
          key: host-build-${{ runner.os }}-${{ hashFiles('apps/host/Package.swift', 'apps/host/Sources/**/*.swift', 'apps/host/Tests/**/*.swift') }}
          restore-keys: |
            host-build-${{ runner.os }}-
      - name: Run Host static checks
        env:
          CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/apps/host/.build/module-cache
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/apps/host/.build/module-cache
        run: |
          cd apps/host
          /usr/bin/swift format lint --strict --recursive Package.swift Sources Tests
          /usr/bin/swift build -c debug --arch arm64 -Xswiftc -warnings-as-errors
          /usr/bin/swift test -Xswiftc -warnings-as-errors
