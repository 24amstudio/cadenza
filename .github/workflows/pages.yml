name: Pages

# Publishes the browser Remote to GitHub Pages. Pages serves it over HTTPS, which Web Bluetooth requires. Cadenza Host
# keeps serving its own copy over plain HTTP on the LAN, so this site is the only place Bluetooth pairing is offered.

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - tools/ci/web.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Check and generate the browser Remote
        env:
          CADENZA_WEB_BASE_URL: ${{ steps.pages.outputs.base_path }}/
        run: bash tools/ci/web.sh
      # Pages runs Jekyll unless this marker exists, and Jekyll hides the _nuxt directory.
      - name: Mark the site as static
        run: touch apps/web/.output/public/.nojekyll
      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/.output/public
          include-hidden-files: 'true'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
