<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadenza</title>
    <link rel="stylesheet" href="receiver.css" />
  </head>
  <body>
    <main id="stage" data-mode="audio_only">
      <cast-media-player id="player" class="player"></cast-media-player>
      <div id="backdrop" class="backdrop" aria-hidden="true">
        <img id="artwork" class="artwork" alt="" />
        <video
          id="motion"
          class="motion"
          autoplay
          loop
          muted
          playsinline
        ></video>
        <div class="scrim"></div>
      </div>
      <header class="meta">
        <p id="title" class="title"></p>
        <p id="artist" class="artist"></p>
      </header>
      <section class="lyrics" aria-live="polite">
        <p id="line" class="line"></p>
        <p id="translation" class="translation"></p>
        <p id="next" class="next"></p>
      </section>
    </main>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script type="module" src="receiver.js"></script>
  </body>
</html>
